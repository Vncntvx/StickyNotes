# StickyNotes.xcodeproj specification (XcodeGen format)
#
# T001 (tasks.md): "Create Xcode workspace with macOS app target `App` and
# Widget Extension target `WidgetExtension` per plan.md §Project Structure."
#
# This dev machine has Xcode-beta (`/Applications/Xcode-beta.app`, Xcode 27.0)
# — see Documentation/toolchain.md. The binary `.xcodeproj` is generated by
# running `xcodegen` with `DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer`
# (the system default still points at CLT). This file is the project
# specification; XcodeGen reads it and emits `StickyNotes.xcodeproj`.
#
# Reconciliation with quickstart.md: the project file is `StickyNotes.xcodeproj`
# with scheme `StickyNotes` (the app target). The `App/` directory holds the
# app target's sources; `WidgetExtension/` holds the widget target's sources.
# This matches both T001 (target-role name `App`) and quickstart.md (project/
# scheme name `StickyNotes`).
#
# Install XcodeGen: `brew install xcodegen`, then `xcodegen generate` from
# the repo root.

name: StickyNotes
options:
  bundleIdPrefix: local.stickynotes
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "YES"
    # App Group placeholder (quickstart.md §Placeholder App Group + entitlements)
    APP_GROUP_ID: group.local.stickynotes.placeholder

packages:
  StickyCore:
    path: Packages/StickyCore

targets:

  # --------------------------------------------------------------------------
  # App target — the menu-bar-primary sticky-notes macOS app.
  # --------------------------------------------------------------------------
  StickyNotes:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app
        PRODUCT_NAME: StickyNotes
        INFOPLIST_KEY_CFBundleDisplayName: Sticky Notes
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_LSUIElement: "YES"  # menu-bar-primary; Dock default-on is via activation policy (FR-008)
        CODE_SIGN_ENTITLEMENTS: App/Resources/StickyNotes.entitlements
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
    dependencies:
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence
      - package: StickyCore
        product: EditorCore
      - package: StickyCore
        product: AssetStore
      - package: StickyCore
        product: SecurityCore
      - package: StickyCore
        product: SyncCore
      - package: StickyCore
        product: SystemBridge
      - target: WidgetExtension

  # --------------------------------------------------------------------------
  # Widget Extension target — WidgetKit + AppIntents.
  # Depends only on minimal Domain + Persistence surface (constitution VI/XI);
  # NEVER links SyncCore/SecurityCore.
  # --------------------------------------------------------------------------
  WidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.widget
        PRODUCT_NAME: StickyNotesWidget
        INFOPLIST_KEY_CFBundleDisplayName: Sticky Notes Widget
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        SKIP_INSTALL: "YES"
    dependencies:
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence

  # --------------------------------------------------------------------------
  # Test targets (constitution XII — tests mandatory).
  # --------------------------------------------------------------------------
  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.tests
    dependencies:
      - target: StickyNotes

  AppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.uitests
    dependencies:
      - target: StickyNotes

schemes:
  StickyNotes:
    build:
      targets:
        StickyNotes: all
        WidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
        - AppUITests
    archive:
      config: Release
