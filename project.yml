# StickyNotes.xcodeproj specification (XcodeGen format)
#
# T001 (tasks.md): "Create Xcode workspace with macOS app target `App` per
# plan.md §Project Structure." (The Widget Extension target was REMOVED
# 2026-08-13 with the widget surface — see spec.md US8 note.)
#
# The AppUITests target was REMOVED 2026-08-13: the unsigned XCTRunner-based
# AppUITests-Runner.app triggers macOS Gatekeeper "is damaged" dialogs on the
# dev machine, and the click journeys were already cancelled 2026-08-09
# (unreliable on macOS 27 beta). Automated coverage stays in AppTests.
#
# Reconciliation (T249): the binary `StickyNotes.xcodeproj` IS committed to
# the repository, and `project.yml` is the source of truth. CI regenerates
# the project with `xcodegen generate` and runs `git diff --exit-code` as a
# drift check — any source change that forgets to regenerate the project
# fails CI. To regenerate locally:
#   `brew install xcodegen && xcodegen generate`
#
# This dev machine has Xcode-beta (`/Applications/Xcode-beta.app`, Xcode 27.0)
# — see Documentation/toolchain.md. The binary `.xcodeproj` is generated by
# running `xcodegen generate` (the system default still points at CLT).
#
# Reconciliation with quickstart.md: the project file is `StickyNotes.xcodeproj`
# with scheme `StickyNotes` (the app target). The `App/` directory holds the
# app target's sources. This matches both T001 (target-role name `App`) and
# quickstart.md (project/scheme name `StickyNotes`).

name: StickyNotes
options:
  bundleIdPrefix: local.stickynotes
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "YES"

packages:
  StickyCore:
    path: Packages/StickyCore
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.0

targets:

  # --------------------------------------------------------------------------
  # App target — the menu-bar-primary sticky-notes macOS app.
  # --------------------------------------------------------------------------
  StickyNotes:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      # R3.8 (remediation roadmap 2026-08-14): per-file resources — the
      # previous `type: folder` folder-reference never compiled
      # Localizable.xcstrings into the bundle (no Localizable.strings was
      # ever produced; knownRegions also lacked zh-Hans), so all
      # `String(localized:)` calls silently fell back to their keys.
      - path: App/Resources
        excludes:
          - Info.plist
          - StickyNotes.entitlements
      - path: App/Resources/Info.plist
        buildPhase: none
      - path: App/Resources/StickyNotes.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app
        PRODUCT_NAME: StickyNotes
        INFOPLIST_KEY_CFBundleDisplayName: Sticky Notes
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_LSUIElement: "YES"  # menu-bar-primary; Dock default-on is via activation policy (FR-008)
        CODE_SIGN_ENTITLEMENTS: App/Resources/StickyNotes.entitlements
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
    dependencies:
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence
      - package: StickyCore
        product: EditorCore
      - package: StickyCore
        product: AssetStore
      - package: StickyCore
        product: SecurityCore
      - package: StickyCore
        product: SyncCore
      - package: StickyCore
        product: SystemBridge

  # --------------------------------------------------------------------------
  # Test targets (constitution XII — tests mandatory).
  # --------------------------------------------------------------------------
  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StickyNotes.app/Contents/MacOS/StickyNotes"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # T305: test bundles need a generated Info.plist so the scheme can
        # also run signed (ad-hoc).
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: StickyNotes
      # T307: the test bundle runs INSIDE the app host process (TEST_HOST);
      # the host statically contains the StickyCore modules, so the bundle
      # must NOT link its own copies — linking them produced duplicate class
      # implementations ("implemented in both ..." objc runtime warnings that
      # may cause spurious casting failures and mysterious crashes). The
      # modules stay available for compilation; symbols resolve from the host.
      - package: StickyCore
        product: Domain
        link: false
      - package: StickyCore
        product: Persistence
        link: false
      - package: StickyCore
        product: EditorCore
        link: false
      - package: StickyCore
        product: SystemBridge
        link: false
      - package: GRDB.swift
        product: GRDB
        link: false

schemes:
  StickyNotes:
    build:
      targets:
        StickyNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
    archive:
      config: Release
