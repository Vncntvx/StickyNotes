# StickyNotes.xcodeproj specification (XcodeGen format)
#
# T001 (tasks.md): "Create Xcode workspace with macOS app target `App` and
# Widget Extension target `WidgetExtension` per plan.md §Project Structure."
#
# Reconciliation (T249): the binary `StickyNotes.xcodeproj` IS committed to
# the repository, and `project.yml` is the source of truth. CI regenerates
# the project with `xcodegen generate` and runs `git diff --exit-code` as a
# drift check — any source change that forgets to regenerate the project
# fails CI. To regenerate locally:
#   `brew install xcodegen && xcodegen generate`
#
# This dev machine has Xcode-beta (`/Applications/Xcode-beta.app`, Xcode 27.0)
# — see Documentation/toolchain.md. The binary `.xcodeproj` is generated by
# running `xcodegen generate` (the system default still points at CLT).
#
# Reconciliation with quickstart.md: the project file is `StickyNotes.xcodeproj`
# with scheme `StickyNotes` (the app target). The `App/` directory holds the
# app target's sources; `WidgetExtension/` holds the widget target's sources.
# This matches both T001 (target-role name `App`) and quickstart.md (project/
# scheme name `StickyNotes`).

name: StickyNotes
options:
  bundleIdPrefix: local.stickynotes
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "YES"
    # App Group placeholder (quickstart.md §Placeholder App Group + entitlements)
    APP_GROUP_ID: group.local.stickynotes.placeholder

packages:
  StickyCore:
    path: Packages/StickyCore
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.0

targets:

  # --------------------------------------------------------------------------
  # App target — the menu-bar-primary sticky-notes macOS app.
  # --------------------------------------------------------------------------
  StickyNotes:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app
        PRODUCT_NAME: StickyNotes
        INFOPLIST_KEY_CFBundleDisplayName: Sticky Notes
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_LSUIElement: "YES"  # menu-bar-primary; Dock default-on is via activation policy (FR-008)
        CODE_SIGN_ENTITLEMENTS: App/Resources/StickyNotes.entitlements
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
    dependencies:
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence
      - package: StickyCore
        product: EditorCore
      - package: StickyCore
        product: AssetStore
      - package: StickyCore
        product: SecurityCore
      - package: StickyCore
        product: SyncCore
      - package: StickyCore
        product: SystemBridge
      - target: WidgetExtension

  # --------------------------------------------------------------------------
  # Widget Extension target — WidgetKit + AppIntents.
  # Depends only on minimal Domain + Persistence surface (constitution VI/XI);
  # NEVER links SyncCore/SecurityCore.
  # --------------------------------------------------------------------------
  WidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.widget
        PRODUCT_NAME: StickyNotesWidget
        INFOPLIST_KEY_CFBundleDisplayName: Sticky Notes Widget
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        SKIP_INSTALL: "YES"
    dependencies:
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence
      - package: GRDB.swift
        product: GRDB

  # --------------------------------------------------------------------------
  # Test targets (constitution XII — tests mandatory).
  # --------------------------------------------------------------------------
  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StickyNotes.app/Contents/MacOS/StickyNotes"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: StickyNotes
      - package: StickyCore
        product: Domain
      - package: StickyCore
        product: Persistence
      - package: StickyCore
        product: EditorCore
      - package: StickyCore
        product: SystemBridge
      - package: GRDB.swift
        product: GRDB

  AppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stickynotes.app.uitests
    dependencies:
      - target: StickyNotes

schemes:
  StickyNotes:
    build:
      targets:
        StickyNotes: all
        WidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
        - AppUITests
    archive:
      config: Release
